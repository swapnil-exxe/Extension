<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Modern Quiz Layout (User Screenshot Replica)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdfdfd; padding: 30px; }
    .quiz-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; margin-bottom: 24px; max-width: 700px; margin-left: auto; margin-right: auto; }
    .q-title { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 16px; }
    .option-row { display: flex; align-items: center; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; }
    .option-row:hover { background-color: #f9fafb; }
    .option-row input { margin-right: 14px; width: 18px; height: 18px; }
    .option-text { font-size: 14px; color: #374151; font-weight: 500; }
  </style>
</head>
<body>
  <div class="quiz-card">
    <div class="q-title">4. Where would you make your place?</div>
    <div class="options-group">
      <div class="option-row">
        <input type="radio" name="question_4" id="q4_opt1" value="0">
        <label for="q4_opt1" class="option-text">A cave or a tree house</label>
      </div>
      <div class="option-row">
        <input type="radio" name="question_4" id="q4_opt2" value="1">
        <label for="q4_opt2" class="option-text">A dark cave</label>
      </div>
      <div class="option-row">
        <input type="radio" name="question_4" id="q4_opt3" value="2">
        <label for="q4_opt3" class="option-text">At the foot of a small tree</label>
      </div>
      <div class="option-row">
        <input type="radio" name="question_4" id="q4_opt4" value="3">
        <label for="q4_opt4" class="option-text">Up in the trees in a small house</label>
      </div>
      <div class="option-row">
        <input type="radio" name="question_4" id="q4_opt5" value="4">
        <label for="q4_opt5" class="option-text">Wherever I feel like it</label>
      </div>
      <div class="option-row">
        <input type="radio" name="question_4" id="q4_opt6" value="5">
        <label for="q4_opt6" class="option-text">A big rock</label>
      </div>
      <div class="option-row">
        <input type="radio" name="question_4" id="q4_opt7" value="6">
        <label for="q4_opt7" class="option-text">An animal skin sleeping-sack</label>
      </div>
    </div>
  </div>

  <div class="quiz-card">
    <div class="q-title">5. What would you do in your spare time?</div>
    <div class="options-group">
      <div class="option-row">
        <input type="radio" name="question_5" id="q5_opt1" value="0">
        <label for="q5_opt1" class="option-text">Hunt</label>
      </div>
      <div class="option-row">
        <input type="radio" name="question_5" id="q5_opt2" value="1">
        <label for="q5_opt2" class="option-text">Bask in the sun</label>
      </div>
      <div class="option-row">
        <input type="radio" name="question_5" id="q5_opt3" value="2">
        <label for="q5_opt3" class="option-text">Build</label>
      </div>
    </div>
  </div>
</body>
</html>
