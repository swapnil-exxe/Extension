<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moodle Test Fixture 8: Dynamic Question Page</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; padding: 20px; }
    .que { background: #fff; border: 1px solid #dee2e6; border-radius: 4px; max-width: 780px; margin: 0 auto; display: flex; }
    .info { width: 140px; background: #e9ecef; padding: 12px; font-size: 13px; border-right: 1px solid #dee2e6; }
    .content { padding: 16px; flex: 1; }
    .qtext { font-size: 15px; margin-bottom: 12px; font-weight: 500; }
    .prompt { font-size: 13px; color: #6c757d; margin-bottom: 12px; font-style: italic; }
    .answer .r0, .answer .r1 { display: flex; align-items: center; padding: 8px 12px; margin-bottom: 6px; border: 1px solid #edf2f7; border-radius: 4px; }
    .answer input { margin-right: 10px; }
    .answernumber { font-weight: bold; margin-right: 6px; }
    .nav-bar { max-width: 780px; margin: 20px auto; display: flex; justify-content: space-between; }
    button { padding: 8px 16px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div style="max-width: 780px; margin: 0 auto 12px auto;">
    <h2>Moodle Dynamic AJAX Quiz Navigation Simulator</h2>
    <p style="color: #64748b;">Simulates Moodle loading questions asynchronously without full page reload.</p>
  </div>

  <div id="dynamic-quiz-host">
    <!-- Initial Question -->
    <div id="q_dyn" class="que multichoice deferredfeedback notyetanswered">
      <div class="info">
        <h3 class="no">Question <span class="qno">1</span></h3>
        <div class="state">Not yet answered</div>
        <div class="grade">Marked out of 1.00</div>
      </div>
      <div class="content">
        <div class="formulation clearfix">
          <div class="qtext">What is the capital city of France?</div>
          <div class="prompt">Select one:</div>
          <div class="answer">
            <div class="r0">
              <input type="radio" name="qdyn:1_answer" value="0" id="qdyn_opt0">
              <label for="qdyn_opt0"><span class="answernumber">a. </span>Berlin</label>
            </div>
            <div class="r1">
              <input type="radio" name="qdyn:1_answer" value="1" id="qdyn_opt1">
              <label for="qdyn_opt1"><span class="answernumber">b. </span>Madrid</label>
            </div>
            <div class="r0">
              <input type="radio" name="qdyn:1_answer" value="2" id="qdyn_opt2">
              <label for="qdyn_opt2"><span class="answernumber">c. </span>Paris</label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <button id="btn-next-question">Simulate AJAX: Load Next Question</button>
  </div>

  <script>
    const questions = [
      {
        no: 2,
        text: "Which organelle is known as the powerhouse of the eukaryotic cell?",
        options: ["Ribosome", "Mitochondria", "Nucleus", "Vacuole"]
      },
      {
        no: 3,
        text: "What is the speed of light in vacuum approximately?",
        options: ["300,000 km/s", "150,000 km/s", "1,000 km/s"]
      }
    ];

    let currentIdx = 0;
    document.getElementById('btn-next-question').addEventListener('click', () => {
      const q = questions[currentIdx % questions.length];
      currentIdx++;

      const host = document.getElementById('dynamic-quiz-host');
      host.innerHTML = `
        <div id="q_dyn_${q.no}" class="que multichoice deferredfeedback notyetanswered">
          <div class="info">
            <h3 class="no">Question <span class="qno">${q.no}</span></h3>
            <div class="state">Not yet answered</div>
            <div class="grade">Marked out of 1.00</div>
          </div>
          <div class="content">
            <div class="formulation clearfix">
              <div class="qtext">${q.text}</div>
              <div class="prompt">Select one:</div>
              <div class="answer">
                ${q.options.map((opt, i) => `
                  <div class="r${i % 2}">
                    <input type="radio" name="qdyn_${q.no}:1_answer" value="${i}" id="qdyn_${q.no}_opt${i}">
                    <label for="qdyn_${q.no}_opt${i}"><span class="answernumber">${String.fromCharCode(97 + i)}. </span>${opt}</label>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
