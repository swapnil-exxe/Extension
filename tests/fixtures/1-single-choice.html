<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moodle Test Fixture 1: Single-Choice Question</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; padding: 20px; }
    .que { background: #fff; border: 1px solid #dee2e6; border-radius: 4px; max-width: 780px; margin: 0 auto; display: flex; }
    .info { width: 140px; background: #e9ecef; padding: 12px; font-size: 13px; border-right: 1px solid #dee2e6; }
    .content { padding: 16px; flex: 1; }
    .qtext { font-size: 15px; margin-bottom: 12px; font-weight: 500; }
    .prompt { font-size: 13px; color: #6c757d; margin-bottom: 12px; font-style: italic; }
    .answer .r0, .answer .r1 { display: flex; align-items: center; padding: 8px 12px; margin-bottom: 6px; border: 1px solid #edf2f7; border-radius: 4px; }
    .answer input { margin-right: 10px; }
    .answernumber { font-weight: bold; margin-right: 6px; }
  </style>
</head>
<body>
  <h2>Moodle Practice Quiz: Biology 101</h2>
  <div id="q1" class="que multichoice deferredfeedback notyetanswered">
    <div class="info">
      <h3 class="no">Question <span class="qno">1</span></h3>
      <div class="state">Not yet answered</div>
      <div class="grade">Marked out of 1.00</div>
    </div>
    <div class="content">
      <div class="formulation clearfix">
        <div class="qtext">Where does photosynthesis primarily take place in plant cells?</div>
        <div class="prompt">Select one:</div>
        <div class="answer">
          <div class="r0">
            <input type="radio" name="q1:1_answer" value="0" id="q1:1_answer0">
            <label for="q1:1_answer0"><span class="answernumber">a. </span>Mitochondria</label>
          </div>
          <div class="r1">
            <input type="radio" name="q1:1_answer" value="1" id="q1:1_answer1">
            <label for="q1:1_answer1"><span class="answernumber">b. </span>Chloroplasts</label>
          </div>
          <div class="r0">
            <input type="radio" name="q1:1_answer" value="2" id="q1:1_answer2">
            <label for="q1:1_answer2"><span class="answernumber">c. </span>Ribosomes</label>
          </div>
          <div class="r1">
            <input type="radio" name="q1:1_answer" value="3" id="q1:1_answer3">
            <label for="q1:1_answer3"><span class="answernumber">d. </span>Golgi apparatus</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
